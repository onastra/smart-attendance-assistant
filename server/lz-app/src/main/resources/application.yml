server:
  port: ${LZ_SERVER_PORT:8080}
  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: lianzhi-attendance

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 注意：MySQL Connector/J 的 characterEncoding 必须是 Java 认识的字符集名（UTF-8），
    # 写成 utf8mb4 会直接抛 UnsupportedEncodingException
    url: ${LZ_DB_URL:jdbc:mysql://127.0.0.1:3306/lianzhi?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${LZ_DB_USERNAME:root}
    password: ${LZ_DB_PASSWORD:}
    druid:
      # 初始连接数设为 0：数据库暂不可用时应用仍可启动，
      # 由 /api/system/health 真实探测连通性，便于快速定位配置问题
      initial-size: 0
      min-idle: 0
      max-active: 20
      # 健康检查需要快速失败：等待过久会让调用方误以为服务不可用
      max-wait: 5000
      # 连接出错后快速失败，避免每次请求都排队等待超时
      fail-fast: true
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      filters: stat,wall
      stat-view-servlet:
        enabled: false

  data:
    redis:
      # 连接参数全部走环境变量，便于容器/K8s 注入。
      # 注意：只有 lz.cache.enabled=true 时才会真正建立连接；
      # 关闭开关时这些配置被忽略，应用不依赖 Redis 也能启动。
      host: ${LZ_REDIS_HOST:127.0.0.1}
      port: ${LZ_REDIS_PORT:6379}
      password: ${LZ_REDIS_PASSWORD:}
      database: ${LZ_REDIS_DB:0}
      # 超时刻意设短：缓存不可用时应快速降级直查，而不是让每个请求都等几秒
      connect-timeout: ${LZ_REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${LZ_REDIS_TIMEOUT:2s}
      lettuce:
        pool:
          enabled: ${LZ_REDIS_POOL_ENABLED:true}
          max-active: 16
          max-idle: 8
          min-idle: 1
          max-wait: 2s

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  jackson:
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath*:mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'null'
    call-setters-on-nulls: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.lianzhi.attendance: ${LZ_LOG_LEVEL:info}

lz:
  web:
    allowed-origins: ${LZ_WEB_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

  security:
    jwt:
      # 正式环境必须通过环境变量 LZ_JWT_SECRET 注入强密钥，禁止使用默认值
      secret: ${LZ_JWT_SECRET:please-change-me-32-bytes-minimum-lianzhi}
      expire-seconds: ${LZ_JWT_EXPIRE_SECONDS:7200}

  # ===== 以下能力均为"可切换的外部依赖"，默认关闭，关闭时应用必须仍能启动 =====
  cache:
    # Redis 未安装时保持 false；代码侧会降级并记录 WARN，不伪造缓存命中
    enabled: ${LZ_CACHE_ENABLED:false}
    # 键前缀：带版本号，便于一次性失效旧结构而不误删新数据
    key-prefix: ${LZ_CACHE_KEY_PREFIX:lz:cache:v1:}
    ttl:
      # 场所详情：变更频率低，10 分钟；写操作会主动失效
      place-detail-seconds: ${LZ_CACHE_TTL_PLACE:600}
      # 统计看板汇总：当天数据会随打卡变化，短 TTL + 响应里标注 cached，避免"看起来没更新"
      statistics-summary-seconds: ${LZ_CACHE_TTL_SUMMARY:60}

  nacos:
    # 微服务治理：已配置未启用。启用需本地 Nacos Server 2.x，详见 docs/architecture.md
    enabled: ${LZ_NACOS_ENABLED:false}
    server-addr: ${LZ_NACOS_ADDR:127.0.0.1:8848}

  feign:
    # 服务间 HTTP 调用：单体架构内不需要，保持关闭
    enabled: ${LZ_FEIGN_ENABLED:false}

  face:
    # noop = 明确标注的模拟实现；arcsoft = 真实 SDK（需授权，当前不可得）
    provider: ${LZ_FACE_PROVIDER:noop}
    # 真实 SDK 授权参数；目前无论是否填写都拿不到 SDK，填了也不会"假装可用"
    app-id: ${LZ_FACE_APP_ID:}
    sdk-key: ${LZ_FACE_SDK_KEY:}
    # 最小化生物特征存储：默认不保存原始人脸图片
    store-image: ${LZ_FACE_STORE_IMAGE:false}

  # ===== 知识库（模块 F）=====
  kb:
    # 切片窗口与重叠。重叠用于避免一句话被切断后两边都检索不到
    chunk-size: ${LZ_KB_CHUNK_SIZE:300}
    chunk-overlap: ${LZ_KB_CHUNK_OVERLAP:60}
    # 单文档最大抽取字符数，防止超大文件吃满内存
    max-chars-per-document: ${LZ_KB_MAX_CHARS:200000}
    # 全文检索相关度下限：低于此值视为没有真正命中，直接回复"未找到足够依据"
    min-score: ${LZ_KB_MIN_SCORE:0.05}
    # 一次问答最多带回几条来源
    top-k: ${LZ_KB_TOP_K:5}
    excerpt-length: ${LZ_KB_EXCERPT_LENGTH:120}
    allowed-extensions: ${LZ_KB_EXTENSIONS:pdf,docx,xlsx,pptx,doc,xls,ppt,txt,md}

  llm:
    # 知识库生成增强：未配置 Key 时走 retrieval-only 模式，明确提示而非伪造答案
    enabled: ${LZ_LLM_ENABLED:false}
    api-key: ${LZ_LLM_API_KEY:}
    base-url: ${LZ_LLM_BASE_URL:}
    model: ${LZ_LLM_MODEL:}

  # ===== 考勤业务口径（2026-10-26 确认：全局统一 + 配置化，暂不引入班次表）=====
  attendance:
    # 上下班时间与宽限：迟到 = 上班打卡晚于 上班时间 + 宽限分钟
    work-start-time: ${LZ_ATTENDANCE_WORK_START:09:00}
    work-end-time: ${LZ_ATTENDANCE_WORK_END:18:00}
    late-grace-minutes: ${LZ_ATTENDANCE_LATE_GRACE:15}
    early-leave-grace-minutes: ${LZ_ATTENDANCE_EARLY_GRACE:0}
    # 同一员工同一场所同类型在该分钟数内的第二次提交视为重复打卡
    duplicate-window-minutes: ${LZ_ATTENDANCE_DUP_WINDOW:5}
    # true = 客户端上报了坐标才做围栏校验；未上报则跳过并在记录中标注，不谎称校验过
    location-check-enabled: ${LZ_ATTENDANCE_LOCATION_CHECK:true}
    # 二维码有效期：动态码 120 秒（前端倒计时刷新），长期固定码 24 小时（管理员手动失效）
    qr-dynamic-ttl-seconds: ${LZ_QR_DYNAMIC_TTL:120}
    qr-fixed-ttl-seconds: ${LZ_QR_FIXED_TTL:86400}
    qr-max-ttl-seconds: ${LZ_QR_MAX_TTL:604800}
    qr-image-size: ${LZ_QR_IMAGE_SIZE:320}
    # 二维码签名密钥：与 JWT 密钥分开，正式环境请用 LZ_QR_SIGN_SECRET 注入
    qr-sign-secret: ${LZ_QR_SIGN_SECRET:lianzhi-qr-default-secret-please-change}

  map:
    # 地图坐标采集：未配置 Key 时使用手动坐标录入
    provider: ${LZ_MAP_PROVIDER:none}
    api-key: ${LZ_MAP_API_KEY:}

  storage:
    # 本地受控存储；云端存储待确认后再接入
    provider: ${LZ_STORAGE_PROVIDER:local}
    local-path: ${LZ_STORAGE_PATH:./data/files}
