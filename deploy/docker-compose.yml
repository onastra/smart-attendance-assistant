# =============================================================
#  联智考勤 —— 一键本地栈（PostgreSQL + Redis + 后端 + 前端）
# -------------------------------------------------------------
#  用法：
#    cd deploy && docker compose up -d --build
#    docker compose ps            # 全部 healthy 后再访问
#    docker compose logs -f backend
#    docker compose down -v       # 连数据卷一起清掉（下次会重新初始化）
#
#  端口刻意避开本机已占用端口：
#    本机 PostgreSQL 5432（容器 lz-postgres）/ Redis 6379 / 后端 8080 / 前端 5173 仍在跑，
#    容器分别映射到 15432 / 16379 / 18080 / 18081，两套可以并存。
#
#  ⚠️ 2026-10-27：数据库已从 MySQL 迁移到 PostgreSQL（驱动与全部 Mapper 方言均为 PG）。
#     db 服务随之由 mysql:5.7 换成 postgres:16，初始化脚本改用 deploy/pg-init/；
#     旧的 deploy/mysql-init/ 已不再被引用（保留仅供对照）。
# =============================================================
name: lianzhi

services:
  postgres:
    image: postgres:16
    # 容器名不能叫 lz-postgres：本机已有一个同名容器占着 5432，改名避免冲突
    container_name: lz-pg
    environment:
      POSTGRES_DB: lianzhi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: lianzhi_pg_2026
      TZ: Asia/Shanghai
      # 官方镜像自带 contrib，pg_trgm 可直接 CREATE EXTENSION（知识库中文检索依赖它）
    ports:
      - "15432:5432"
    volumes:
      # 初始化脚本 + SQL 源文件（只读挂载，不在容器里留副本）
      - ./pg-init:/docker-entrypoint-initdb.d:ro
      - ../docs/sql:/seed:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lianzhi"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: lz-redis
    command:
      - redis-server
      - --requirepass
      - lianzhi_demo_redis
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    ports:
      - "16379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a lianzhi_demo_redis --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    image: lianzhi/backend:1.0.0
    container_name: lz-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # 数据库：主机用服务名 postgres；容器内 PG 未开 SSL，不要加 sslmode=require
      LZ_DB_URL: jdbc:postgresql://postgres:5432/lianzhi
      LZ_DB_USERNAME: postgres
      LZ_DB_PASSWORD: lianzhi_pg_2026
      # 缓存：容器内 Redis 自带口令
      LZ_REDIS_HOST: redis
      LZ_REDIS_PORT: "6379"
      LZ_REDIS_PASSWORD: lianzhi_demo_redis
      LZ_CACHE_ENABLED: "true"
      # 密钥：演示环境固定值，正式部署必须换成环境变量注入的强密钥
      LZ_JWT_SECRET: demo-only-jwt-secret-please-override-in-production-32b
      LZ_QR_SIGN_SECRET: demo-only-qr-sign-secret-please-override
      # 允许的前端来源：容器化前端走 18081
      LZ_WEB_ORIGINS: http://localhost:18081,http://127.0.0.1:18081
      LZ_LOG_LEVEL: info
      TZ: Asia/Shanghai
    ports:
      - "18080:8080"
    volumes:
      # 上传文件的落地目录必须持久化：容器重建后若目录没了，
      # sys_file 记录还在而磁盘上文件已消失，下载会报"文件已丢失"。
      - app-files:/app/data/files
    healthcheck:
      # 真实打一次健康检查接口：它内部会真实探测数据库与 Redis，比端口连通更有意义
      test: ["CMD-SHELL",
             "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /api/system/health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n\" >&3; grep -q \"application\" <&3'"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    image: lianzhi/frontend:1.0.0
    container_name: lz-frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "18081:80"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  app-files:
