apiVersion: v1
kind: Secret
metadata:
  name: lianzhi-secret
  namespace: lianzhi
type: Opaque
# 演示环境固定值（base64 不是加密，只是 K8s 的编码要求）。
# 正式部署必须用 kubectl create secret 或外部密钥管理注入，且不得提交到版本库。
stringData:
  POSTGRES_DB: "lianzhi"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "lianzhi_demo"
  # 后端连库用的口令，必须与上面 POSTGRES_PASSWORD 一致
  LZ_DB_PASSWORD: "lianzhi_demo"
  LZ_REDIS_PASSWORD: "lianzhi_demo_redis"
  LZ_JWT_SECRET: "demo-only-jwt-secret-please-override-in-production-32b"
  LZ_QR_SIGN_SECRET: "demo-only-qr-sign-secret-please-override"
