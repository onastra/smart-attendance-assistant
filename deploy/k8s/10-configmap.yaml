apiVersion: v1
kind: ConfigMap
metadata:
  name: lianzhi-config
  namespace: lianzhi
data:
  # 非敏感配置。敏感项一律放 Secret，不在这里出现。
  # 集群内走 Service 名 postgres（见 30-postgres.yaml）。容器内 PG 未开 SSL，不加 sslmode。
  LZ_DB_URL: "jdbc:postgresql://postgres:5432/lianzhi"
  LZ_DB_USERNAME: "postgres"
  LZ_REDIS_HOST: "redis"
  LZ_REDIS_PORT: "6379"
  LZ_CACHE_ENABLED: "true"
  LZ_FACE_PROVIDER: "noop"
  LZ_MAP_PROVIDER: "none"
  LZ_LLM_ENABLED: "false"
  LZ_NACOS_ENABLED: "false"
  LZ_FEIGN_ENABLED: "false"
  LZ_LOG_LEVEL: "info"
  TZ: "Asia/Shanghai"
