apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: lianzhi
spec:
  # 普通 ClusterIP 即可：这里只有单实例，不做读写分离
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: lianzhi
spec:
  replicas: 1
  strategy:
    # 单实例数据库不用滚动更新：先停旧的再起新的，避免两个进程抢同一个数据目录
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # 官方镜像里 postgres 用户的 uid/gid 是 999。PVC 由 root 创建时属组是 root，
      # 不声明 fsGroup 的话 initdb 会因为数据目录不可写而失败。
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:16
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: lianzhi-secret
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: lianzhi-secret
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lianzhi-secret
                  key: POSTGRES_PASSWORD
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            # 初始化脚本：必须单独挂成一个文件，SQL 源文件挂到 /seed 由脚本按序导入。
            # 不能直接把 .sql 放进 /docker-entrypoint-initdb.d ——
            # 镜像会按文件名字母序执行，data.sql 会跑到 schema.sql 前面去。
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/01-init.sh
              subPath: 01-init.sh
            - name: seed-sql
              mountPath: /seed
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["sh", "-c", 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"']
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
      volumes:
        - name: init-script
          configMap:
            name: lianzhi-pg-init
            defaultMode: 0755
        - name: seed-sql
          configMap:
            name: lianzhi-sql
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: lianzhi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
