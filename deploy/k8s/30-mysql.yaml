apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: lianzhi
spec:
  # 无头之外的普通 ClusterIP 即可：这里只有单实例，不做读写分离
  type: ClusterIP
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
  namespace: lianzhi
spec:
  replicas: 1
  strategy:
    # 单实例数据库不用滚动更新：先停旧的再起新的，避免两个进程抢同一个数据目录
    type: Recreate
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:5.7
          imagePullPolicy: IfNotPresent
          args:
            # ngram_token_size=2 是只读变量，只能在启动时指定：
            # 它决定中文全文检索按 2 字切词，与知识库检索（模块 F）口径一致
            - --character-set-server=utf8mb4
            - --collation-server=utf8mb4_unicode_ci
            - --ngram_token_size=2
            - --default-time-zone=+08:00
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: lianzhi-secret
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_DATABASE
              valueFrom:
                secretKeyRef:
                  name: lianzhi-secret
                  key: MYSQL_DATABASE
            - name: TZ
              value: Asia/Shanghai
          volumeMounts:
            # 初始化脚本：必须单独挂成一个文件，SQL 源文件挂到 /seed 由脚本按序导入。
            # 不能直接把 .sql 放进 /docker-entrypoint-initdb.d ——
            # 镜像会按文件名字母序执行，data.sql 会跑到 schema.sql 前面去。
            - name: init-script
              mountPath: /docker-entrypoint-initdb.d/01-init.sh
              subPath: 01-init.sh
            - name: seed-sql
              mountPath: /seed
            - name: mysql-data
              mountPath: /var/lib/mysql
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            exec:
              command: ["sh", "-c", 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD" | grep -q alive']
            initialDelaySeconds: 20
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
      volumes:
        - name: init-script
          configMap:
            name: lianzhi-mysql-init
            defaultMode: 0755
        - name: seed-sql
          configMap:
            name: lianzhi-sql
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: lianzhi
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 2Gi
